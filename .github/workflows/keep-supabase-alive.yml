name: Keep Supabase Alive

on:
  schedule:
    # Runs every 3 days at 06:00 UTC (Sunday, Wednesday, Saturday)
    - cron: '0 6 */3 * *'
  workflow_dispatch:

jobs:
  heartbeat:
    runs-on: ubuntu-latest

    steps:
      - name: Log workflow start
        run: |
          echo "==============================================="
          echo "Keep Supabase Alive - workflow started"
          echo "Timestamp (UTC): $(date -u +'%Y-%m-%d %H:%M:%S')"
          echo "Triggered by: ${{ github.event_name }}"
          echo "Repository: ${{ github.repository }}"
          echo "Run ID: ${{ github.run_id }}"
          echo "==============================================="

      - name: Validate secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "Checking required secrets..."
          if [ -z "$SUPABASE_URL" ]; then
            echo "ERROR: SUPABASE_URL secret is missing or empty."
            exit 1
          fi
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "ERROR: SUPABASE_ANON_KEY secret is missing or empty."
            exit 1
          fi
          echo "SUPABASE_URL is set (length: ${#SUPABASE_URL} chars)"
          echo "SUPABASE_ANON_KEY is set (length: ${#SUPABASE_ANON_KEY} chars)"
          echo "Secret validation passed."

      - name: Insert heartbeat row
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "-----------------------------------------------"
          echo "Performing INSERT into keep_alive table"
          echo "Endpoint: $SUPABASE_URL/rest/v1/keep_alive"
          echo "-----------------------------------------------"

          PAYLOAD="{\"pinged_at\":\"$(date -u +'%Y-%m-%dT%H:%M:%SZ')\"}"

          START_TIME=$(date +%s%N)

          HTTP_STATUS=$(curl -s -o /tmp/supabase_response.txt -w "%{http_code}" \
            --max-time 30 \
            -X POST "$SUPABASE_URL/rest/v1/keep_alive" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "$PAYLOAD")

          END_TIME=$(date +%s%N)
          DURATION_MS=$(( (END_TIME - START_TIME) / 1000000 ))

          echo "Response time: ${DURATION_MS} ms"
          echo "HTTP status: $HTTP_STATUS"
          echo "-----------------------------------------------"

          if [ "$HTTP_STATUS" -eq 201 ] || [ "$HTTP_STATUS" -eq 204 ]; then
            echo "Result: SUCCESS - heartbeat row inserted."
            echo "Supabase database activity has been reset for this cycle."
          else
            echo "Result: FAILURE - unexpected HTTP status."
            echo "Response body:"
            cat /tmp/supabase_response.txt
            echo ""
            echo "Troubleshooting:"
            echo "  - Ensure the keep_alive table exists."
            echo "  - Ensure the RLS policy allows anon inserts."
            echo "  - Ensure SUPABASE_ANON_KEY is the public anon key."
            exit 1
          fi

      - name: Log workflow summary
        if: always()
        run: |
          echo "==============================================="
          echo "Workflow finished"
          echo "End timestamp (UTC): $(date -u +'%Y-%m-%d %H:%M:%S')"
          echo "Job status: ${{ job.status }}"
          echo "Next scheduled run: in 3 days at 06:00 UTC"
          echo "==============================================="
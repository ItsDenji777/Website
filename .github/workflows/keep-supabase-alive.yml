name: Keep Supabase Alive

on:
  schedule:
    # Runs every 3 days at 06:00 UTC (within the 7-day inactivity window)
    - cron: '0 6 */3 * *'
  workflow_dispatch:

jobs:
  heartbeat:
    runs-on: ubuntu-latest

    steps:
      - name: Insert heartbeat row
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          python3 << 'PYEOF'
          import os, json, sys, urllib.request, urllib.error
          from datetime import datetime, timezone

          url = os.environ['SUPABASE_URL'].strip().rstrip('/')
          key = os.environ['SUPABASE_ANON_KEY'].strip()
          endpoint = url + '/rest/v1/keep_alive'

          payload = json.dumps({
              'pinged_at': datetime.now(timezone.utc).isoformat()
          }).encode('utf-8')

          print(f'POST {endpoint}')

          req = urllib.request.Request(endpoint, data=payload, method='POST')
          req.add_header('apikey', key)
          req.add_header('Authorization', 'Bearer ' + key)
          req.add_header('Content-Type', 'application/json')
          req.add_header('Prefer', 'return=minimal')

          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  print(f'HTTP {resp.status} - heartbeat inserted, Supabase kept active.')
          except urllib.error.HTTPError as e:
              print(f'HTTP {e.code} - {e.read().decode()}')
              sys.exit(1)
          except Exception as e:
              print(f'Error: {type(e).__name__}: {e}')
              sys.exit(1)
          PYEOF
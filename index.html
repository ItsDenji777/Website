<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DenjiOS - Portfolio by Kasra Seydi</title>
    <meta name="description" content="Kasra Seydi's developer portfolio — explore DenjiOS, software projects, web development, programming, and more.">
    <meta name="author" content="Kasra Seydi">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://kasra-seydi.ir/">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://kasra-seydi.ir/">
    <meta property="og:title" content="Kasra Seydi — Developer Portfolio | DenjiOS">
    <meta property="og:description" content="Kasra Seydi's developer portfolio — explore DenjiOS, software projects, web development, programming, and more.">
    <meta property="og:site_name" content="DenjiOS">
    <meta property="og:image" content="https://kasra-seydi.ir/assets/og-image.png">

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Kasra Seydi — Developer Portfolio | DenjiOS">
    <meta name="twitter:description" content="Kasra Seydi's developer portfolio — explore DenjiOS, software projects, web development, programming, and more.">
    <meta name="twitter:image" content="https://kasra-seydi.ir/assets/og-image.png">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/assets/favicons/favicon-96x96.png?v=1" sizes="96x96">
    <link rel="icon" type="image/svg+xml" href="/assets/favicons/favicon.svg?v=1">
    <link rel="shortcut icon" href="/assets/favicons/favicon.ico?v=1">
    <link rel="apple-touch-icon" href="/assets/favicons/apple-touch-icon.png?v=1">
    <link rel="manifest" href="/assets/favicons/site.webmanifest?v=1">

    <meta name="theme-color" content="#1d1d2d">

    <!-- Styles / Scripts -->
    <link rel="stylesheet" href="/style.css">
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js" defer></script>

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Kasra Seydi",
        "url": "https://kasra-seydi.ir/",
        "jobTitle": "Software Developer"
    }
    </script>
</head>
<body>
    <div id="wallpaper"></div>

    <div id="boot-screen">
        <div class="boot-logo" id="boot-logo">
            <img src="assets/images/os_pixelated.png" alt="DenjiOS logo">
        </div>
        <div class="boot-logo-text" id="boot-logo-text">DENJI<span class="os-tag">OS</span></div>
        <div id="boot-lottie"></div>
    </div>

    <div id="desktop">
        <div class="desktop-icons" id="desktop-icons"></div>
        <div id="selection-box"></div>
    </div>

    <div id="windows-container"></div>

    <div id="taskbar">
        <button id="start-btn" title="Start Menu">
            <div class="start-icon" style="mask-image: url('assets/svg/start.svg'); -webkit-mask-image: url('assets/svg/start.svg');"></div>
        </button>
        <div id="taskbar-apps"></div>
        <div id="taskbar-clock">
            <div class="time" id="taskbar-time">12:00</div>
            <div id="taskbar-date">Jan 1</div>
        </div>
    </div>

    <div id="start-menu">
        <div class="menu-header">
            <div class="avatar">
                <div class="profile-icon" style="mask-image: url('assets/svg/user.svg'); -webkit-mask-image: url('assets/svg/user.svg');"></div>
            </div>
            <div class="profile-info">
                <span class="name">User</span>
                <span class="email">user@kasra-seydi.ir</span>
            </div>
        </div>
        <div class="menu-search">
            <div class="search-icon" style="mask-image: url('assets/svg/search.svg'); -webkit-mask-image: url('assets/svg/search.svg');"></div>
            <input type="text" placeholder="Type to search..." id="menu-search-input">
        </div>
        <div class="menu-grid" id="menu-grid"></div>
        <div class="menu-footer">
            <button id="menu-shutdown">
                <div class="footer-icon" style="mask-image: url('assets/svg/shutdown.svg'); -webkit-mask-image: url('assets/svg/shutdown.svg');"></div>
            </button>
            <button id="menu-lock">
                <div class="footer-icon" style="mask-image: url('assets/svg/lock.svg'); -webkit-mask-image: url('assets/svg/lock.svg');"></div>
            </button>
        </div>
    </div>

    <div id="context-menu" style="display:none; position:fixed; z-index:2000; background:var(--surface0); backdrop-filter:blur(16px); border:1px solid var(--border); border-radius:8px; padding:4px; min-width:180px;">
        <div class="ctx-item" data-action="refresh">
            <div class="ctx-icon" style="mask-image: url('assets/svg/refresh.svg'); -webkit-mask-image: url('assets/svg/refresh.svg');"></div>
            Refresh
        </div>
        <div class="ctx-item" data-action="aboutos">
            <div class="ctx-icon" style="mask-image: url('assets/svg/aboutos.svg'); -webkit-mask-image: url('assets/svg/aboutos.svg');"></div>
            About This OS
        </div>
    </div>

    <script src="script.js" defer></script>
</body>
</html>
